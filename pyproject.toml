[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "edagym"
version = "0.1.0"
description = "A reproducible task, execution, and evaluation runtime for EDA work"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "cryptography>=45,<47",
  "klayout>=0.30.12,<0.31",
  "pydantic>=2.12,<3",
  "PyYAML>=6.0,<7",
  "rfc8785>=0.1.4,<0.2",
]

[project.scripts]
edagym = "edagym.cli:main"
edagym-klayout-db = "edagym.drivers.klayout_db:main"

[project.optional-dependencies]
dev = [
  "mypy>=1.17,<2",
  "pytest>=9,<10",
  "ruff>=0.15,<0.16",
  "types-PyYAML>=6.0.12,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/edagym"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["edagym"]
mypy_path = "src"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
