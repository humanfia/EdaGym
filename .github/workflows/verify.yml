name: Verify repository

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out complete history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip

      - name: Select Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: "1.25.4"
          cache: false

      - name: Install verification tools
        env:
          GOBIN: ${{ runner.temp }}/edagym-bin
        run: |
          python -m pip install -e '.[dev]'
          go install github.com/zricethezav/gitleaks/v8@v8.30.0
          sudo install -o root -g root -m 0755 \
            "$GOBIN/gitleaks" /usr/bin/gitleaks

      - name: Verify source and generated contracts
        run: |
          status=0
          ruff check . || { status=1; echo '::error title=ruff::ruff check failed'; }
          mypy --no-incremental || { status=1; echo '::error title=mypy::mypy failed'; }
          if ! pytest -q -rfE > pytest.log 2>&1; then
            status=1
            grep -E '^(FAILED|ERROR) ' pytest.log | head -n 10 | sed 's/^/::error title=pytest::/'
          fi
          tail -n 40 pytest.log
          python -m edagym.authoring contract || { status=1; echo '::error title=contract::authoring contract failed'; }
          exit "$status"

      - name: Audit repository history
        run: |
          status=0
          python scripts/check_repository_policy.py \
            --mode release \
            --gitleaks /usr/bin/gitleaks > audit.txt || status=$?
          cat audit.txt
          grep -E '^(issue |repository-audit .*status=(incomplete|error))' audit.txt \
            | head -n 10 | sed 's/^/::error title=repository-audit::/'
          exit "$status"
