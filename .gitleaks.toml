title = "EdaGym repository policy"

[extend]
useDefault = true

[[rules]]
id = "assigned-high-entropy-credential"
description = "High-entropy value assigned to a credential field"
regex = '''(?i)(?:api[_-]?key|access[_-]?token|client[_-]?secret|password)["']?\s*[:=]\s*["']?([A-Za-z0-9_./+=-]{20,512})'''
secretGroup = 1
entropy = 3.5
keywords = ["api", "key", "token", "secret", "password"]

[[rules]]
id = "eda-license-endpoint"
description = "EDA license endpoint or credential"
regex = '''(?i)(?:SNPSLMD_LICENSE_FILE|CDS_LIC_FILE|LM_LICENSE_FILE)\s*=\s*([^\s"']{3,512})'''
secretGroup = 1
keywords = ["SNPSLMD_LICENSE_FILE", "CDS_LIC_FILE", "LM_LICENSE_FILE"]
